# Gerber2LDI — machine TYPE profile: the old table with the SLD3232VF diode (design §18.5).
#
# `china_ldi_grbl.toml` with ONE part different: the laser. The new diode is driven by a
# constant-current driver that is switched on and off, so `modulation = "onoff"`: the power
# word cannot carry a dose, `S` is always `s_max`, and the dose comes from how fast the head
# moves, from the driver current and from an ND filter (plan `plan_2026_10_23_dose_by_speed`).
#
# It travels in git like the other type profiles: a ready-made solution, not my instance.
# Nothing measured on MY head belongs here — the spot and the scales of the diode go into
# `china_ldi_grbl_sld3232vf.calibration.toml`, which does not exist yet: the diode has a
# different spot, and the old module's numbers are not a measurement of this one.
#
# There is NO PORT here on purpose: the port is per machine and is a command-line argument.

[machine]
name = "china-ldi-sld3232vf"
firmware = "grbl"            # grbl | grblhal | fluidnc
steps_per_mm_x = 80          # $100 = 80 step/mm: one microstep is 12.5 um
steps_per_mm_y = 80          # $101 = 80 step/mm: row_step_um must be a WHOLE number
                             # of these steps, or the rows alternate apart (banding)
max_rate_x_mm_s = 83.333     # $110 = 5000 mm/min: the same table, the same belt
accel_x_mm_s2 = 250          # $120 = 250 mm/s^2: the same stepper and the same mass

[table]
size_x_mm = 210              # $130 = 210 (X travel)
size_y_mm = 270              # $131 = 270 (Y travel)
origin = "front-left"        # front-left | front-right | back-left | back-right

[laser]
wavelength_nm = 405
power_w = 0.0                # MEASURE: optical power of THIS diode after the P–I curve is
                             # taken and the ND filter is chosen. Until then every absolute
                             # dose is unknown — printed as "unknown", never as zero.
modulation = "onoff"         # the driver switches the diode: S is always s_max
usable_fraction = 1.0        # NOT applied at "onoff": there is no duty cycle to cap. The
                             # field is mandatory for every laser, so it stays — and if this
                             # profile ever goes back to "pwm", this must become the ceiling
                             # the module really needs (the old module had 0.8)
s_max = 1000                 # $30 = 1000: the only power word this machine is ever given
pwm_hz = 1000                # NOT applied at "onoff", kept mandatory for the same reason

[scan]
scan_axis = "x"              # MEASURE: which axis scans
row_step_um = 25             # 25 um = 2 steps of $101 = 80 step/mm (12.5 um)
speed_mm_s = 50              # the strip's reference speed: relative dose = power * 50 / v
overscan_mm = 14             # the strip's FASTEST tile is 80 mm/s, and v^2/(2a) at
                             # 250 mm/s^2 is 12.8 mm (design §18.9): 14 leaves a margin.
                             # The old module's 8 mm would refuse an 80 mm/s tile.
bidirectional = false        # start with one direction (design §4.3)
