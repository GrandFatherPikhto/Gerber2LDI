[pytest]
pythonpath = .
testpaths = tests
# Per-test timeout with a thread dump: names WHICH test hung instead of the
# whole run dying silently (same reasoning as KiCadStamp's pytest.ini).
timeout = 60
timeout_method = thread
norecursedirs = .venv venv .git diagnostics techdocs out
# Without pytest-timeout the `timeout` above silently does nothing — refuse to
# start instead (a forgotten `pip install -e ".[dev]"` on one of the machines).
required_plugins = pytest-timeout>=2.4
